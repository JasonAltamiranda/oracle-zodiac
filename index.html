    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mensaje = urlParams.get('mensaje');
        if (mensaje === "ingreso_exitoso") {
            alert("✅ Ingreso exitoso.");
            window.history.replaceState({}, "", "index.html"); // limpia la URL
        }

        // Botón de Registro/Login: si ya hay sesión, se convierte en "Cerrar sesión".
        const loginBtn = document.getElementById("loginButton");
        function actualizarBotonSesion() {
            const usuario = usuarioActual();
            if (usuario) {
                loginBtn.textContent = `Cerrar sesión (${usuario})`;
                loginBtn.onclick = () => { cerrarSesion(); actualizarBotonSesion(); };
            } else {
                loginBtn.textContent = "Registro";
                loginBtn.onclick = () => { window.location.href = "login.html"; };
            }
        }
        actualizarBotonSesion();
    </script>
